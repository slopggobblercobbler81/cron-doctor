[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-doctor"
version = "0.1.0"
description = "A high-speed CLI and library for parsing, explaining, linting, and simulating Cron schedules."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "cron",
    "cron-parser",
    "crontab",
    "schedule",
    "scheduler",
    "cron-expression",
    "cron-explainer",
    "linter"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
cron-doctor = "cron_doctor.cli:main"
crondoc = "cron_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/cron-doctor"
Repository = "https://github.com/slopggobblercobbler81/cron-doctor"
Issues = "https://github.com/slopggobblercobbler81/cron-doctor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["cron_doctor*"]
